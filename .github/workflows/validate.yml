name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read   # least privilege: the token inherits the repo default otherwise

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (pinned 2026-11-08)
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5 (pinned 2026-11-08)
        with:
          python-version: "3.12"

      - name: Install comfy-cli
        run: pip install comfy-cli

      # comfy-cli's own check is weak: it only tests that version is non-empty and runs
      # ruff with --exit-zero, so it cannot fail on a security problem.
      - name: comfy node validate
        run: comfy node validate

      - name: ruff security gate (this one can fail)
        run: |
          pip install ruff
          ruff check --select S102,S307,S605,S607,E702 --exclude test --exclude .git .
