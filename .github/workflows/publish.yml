name: Publish to Comfy registry

on:
  # Manual only. Registry publishing is out of scope for this fork, and a tag-gated trigger
  # made every tag push show a red run (the PublisherId guard below failing by design).
  # The guard still runs, so a manual dispatch validates the tag/version/PublisherId chain
  # before attempting anything.
  workflow_dispatch:

permissions:
  contents: read   # least privilege: the token inherits the repo default otherwise

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (pinned 2026-11-08)
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5 (pinned 2026-11-08)
        with:
          python-version: "3.12"

      # GitHub sets GITHUB_REF_NAME itself, so these guards need no expression
      # interpolation and can be run (and tested) locally.
      - name: Tag must match pyproject version
        run: |
          python - <<'PY'
          import os, sys, tomllib
          version = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]
          tag = os.environ["GITHUB_REF_NAME"].lstrip("v")
          if tag != version:
              sys.exit(f"tag {tag!r} does not match pyproject version {version!r}")
          print(f"tag {tag} matches pyproject version")
          PY

      - name: PublisherId must belong to this fork, not upstream
        run: |
          python - <<'PY'
          import os, sys, tomllib
          pub = tomllib.load(open("pyproject.toml", "rb"))["tool"]["comfy"]["PublisherId"]
          if not pub:
              sys.exit("PublisherId is empty - publish under the fork owner's registry account first")
          if pub == "kaan":
              sys.exit("PublisherId is upstream's - refusing to publish a fork under upstream's name")
          print(f"PublisherId {pub!r} accepted")
          PY

      - name: Publish node
        uses: Comfy-Org/publish-node-action@7578cdb0c1410f2515e6f9b1443c6859cab94f05 # 1.0.1 (pinned 2026-11-08)
        with:
          personal_access_token: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
